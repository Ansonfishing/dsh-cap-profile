<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>cap-profile 渲染验证 harness</title>
<script src="react.js"></script>
<script src="react-dom.js"></script>
<style>
  html,body{margin:0;height:100%;background:#1e1e20;font-family:-apple-system,"Segoe UI","PingFang SC",sans-serif;}
  #tabbar{padding:10px 16px;color:#a3a3a3;font-size:12px;}
  #panel{height:calc(100% - 34px);min-height:640px;}
</style>
</head>
<body>
<div id="tabbar">模拟会话视图 tab 列 · scenario=<span id="sc"></span> · panel=<span id="pid"></span></div>
<script>if (new URLSearchParams(location.search).get("chrome") === "0") document.getElementById("tabbar").style.display = "none";</script>
<div id="panel"></div>
<script>
  // 场景数据: ?scenario=mock(默认,与 index.js 的 summaryPayload 一致)|live(P1 形状,含零错误模型/长签名)|empty|error
  const SCENARIOS = {

      source: "mock",

      note: "P0 示例数据 — P1 起由 ~/.dsh/sessions 真实聚合替换",
      models: [
        {
          id: "local-a / Demo-VL-35B-A3B",
          sessions: 412, toolCalls: 5820, toolErrors: 312, errorRate: 0.054,
          topTools: [
            { tool: "bash", calls: 2140, errors: 122 },
            { tool: "read", calls: 1310, errors: 4 },
            { tool: "edit", calls: 860, errors: 31 },
            { tool: "subagent", calls: 420, errors: 12 },
            { tool: "web_search", calls: 380, errors: 96 }
          ],
          topErrors: [
            { signature: "web_search: API key invalid (502)", count: 96 },
            { signature: "bash: [exit code: 137] OOM", count: 41 },
            { signature: "bash: [sandbox: file access denied]", count: 28 },
            { signature: "read: no such file", count: 22 }
          ]
        },
        {
          id: "local-b / Demo-27B-FP8",
          sessions: 138, toolCalls: 1960, toolErrors: 147, errorRate: 0.075,
          topTools: [
            { tool: "bash", calls: 980, errors: 64 },
            { tool: "read", calls: 640, errors: 2 },
            { tool: "edit", calls: 290, errors: 48 },
            { tool: "computer_click", calls: 50, errors: 33 }
          ],
          topErrors: [
            { signature: "computer_click: 元素编号过期(AX 树失效)", count: 33 },
            { signature: "bash: [exit code: 1]", count: 44 },
            { signature: "edit: old_string 不唯一", count: 15 }
          ]
        }
      ]
    },
    live: {
      source: "live",
      generatedAt: "2026-01-06T15:00:00.000Z",
      note: "数据源 ~/.dsh/sessions(1269 会话,增量缓存)",
      models: [
        {
          id: "local-a / Demo-VL-35B-A3B",
          sessions: 1087, toolCalls: 15230, toolErrors: 611, errorRate: 0.040,
          topTools: [
            { tool: "bash", calls: 5902, errors: 287 },
            { tool: "read", calls: 3110, errors: 9 },
            { tool: "edit", calls: 2014, errors: 88 },
            { tool: "grep", calls: 1203, errors: 3 },
            { tool: "glob", calls: 887, errors: 1 },
            { tool: "subagent", calls: 611, errors: 20 },
            { tool: "web_search", calls: 503, errors: 183 }
          ],
          topErrors: [
            { signature: "bash: [exit code: 137] OOM — npx tsc 全量编译超出 48G 上限", count: 96 },
            { signature: "web_search: API key invalid (502)", count: 91 },
            { signature: "bash: [sandbox: file access denied under workspace-write mode]", count: 58 },
            { signature: "read: no such file or directory: /models/templates/Demo-Chat-Templates/demo-template-v22.3/长路径", count: 34 },
            { signature: "edit: old_string 出现 3 次,不唯一", count: 22 }
          ]
        },
        {
          id: "local-b / Demo-27B-FP8",
          sessions: 152, toolCalls: 2204, toolErrors: 71, errorRate: 0.032,
          topTools: [
            { tool: "bash", calls: 980, errors: 44 },
            { tool: "read", calls: 640, errors: 2 },
            { tool: "edit", calls: 290, errors: 15 },
            { tool: "computer_click", calls: 50, errors: 33 }

          topErrors: [
            { signature: "computer_click: 元素编号过期(AX 树失效)", count: 33 },
            { signature: "bash: [exit code: 1]", count: 44 },
            { signature: "edit: old_string 不唯一", count: 15 }
          ]
        },
        {
          id: "deepseek-v4-flash / deepseek-v4-flash",
          sessions: 6, toolCalls: 210, toolErrors: 0, errorRate: 0,
          topTools: [
            { tool: "bash", calls: 90, errors: 0 },
            { tool: "read", calls: 60, errors: 0 }
          ],
          topErrors: []
        }
      ]
    },
    empty: { source: "live", generatedAt: "2026-01-06T15:00:00.000Z", note: "", models: [] },
    error: null
  };
  const sc = new URLSearchParams(location.search).get("scenario") || "mock";
  document.getElementById("sc").textContent = sc;
  window.fetch = (url) => {
    if (url !== "/capability-profile") return Promise.reject(new Error("unexpected url " + url));
    if (sc === "error") return Promise.resolve({ ok: false, status: 500, statusText: "Internal Server Error", json: () => Promise.resolve({}) });
    return Promise.resolve({ ok: true, status: 200, json: () => Promise.resolve(SCENARIOS[sc]) });
  };
  window.__ModuleLoader__ = { load: (spec) => { window.__spec = spec; } };
</script>
<script src="client-under-test.js"></script>
<script>
  const req = (n) => (n === "react" ? window.React : null);
  const exp = window.__spec.factory(req);
  let Panel = null;
  exp.apply({
    slots: {
      inject: (name, fn) => { if (name === "conversation.view") fn(); },
      register: (cfg, comp) => { Panel = comp; document.getElementById("pid").textContent = cfg.id + " (order " + cfg.order + ")"; }
    }
  });
  ReactDOM.createRoot(document.getElementById("panel")).render(React.createElement(Panel));
</script>
</body>
</html>
